      - endDate: null
        predecessor: '32678'
        startDate: '2023-12-01'
        successor: '5935'
  schemas:
    AllSuccessorsAndPredecessors:
      type: object
      properties:
        successor:
          type: string
        predecessor:
          type: string
        startDate:
          type: string
        endDate:
          type: string
  securitySchemes:
