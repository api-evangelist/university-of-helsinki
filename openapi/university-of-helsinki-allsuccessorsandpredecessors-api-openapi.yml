                  $ref: '#/components/schemas/AllSuccessorsAndPredecessors'
              examples:
                AllSuccessorsAndPredecessors example:
                  $ref: '#/components/examples/AllSuccessorsAndPredecessors'
      tags:
      - AllSuccessorsAndPredecessors
components:
  examples:
    AllSuccessorsAndPredecessors:
      value:
      - endDate: null
        predecessor: '18770'
