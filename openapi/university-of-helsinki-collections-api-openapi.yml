        '422':
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                  message:
                    type: string
                  localized:
                    type: boolean
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorCode:
                    type: string
                  message:
                    type: string
                  localized:
                    type: boolean
      security:
      - Access token: []
      - Lang: []
      - Person token: []
      summary: Get collection by id
      tags:
      - Collections
  /collections/{id}/children:
    get:
      operationId: CollectionsController_findChildren
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: page
