        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        style: form
        explode: true
        allowReserved: false
        schema:
          type: array
          items:
            type: string
      - name: search
        in: query
        description: Search from Company contacts.
        required: false
        deprecated: false
        allowEmptyValue: true
        style: form
        explode: false
        allowReserved: false
        schema:
          type: string
      responses:
        '200':
          description: CompanyContact collection
          content:
            application/ld+json:
              schema:
                type: object
                properties:
                  hydra:member:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyContact.jsonld-read'
                  hydra:totalItems:
                    type: integer
                    minimum: 0
                  hydra:view:
                    type: object
                    example:
                      '@id': string
                      type: string
                      hydra:first: string
                      hydra:last: string
                      hydra:previous: string
                      hydra:next: string
                    properties:
                      '@id':
                        type: string
                        format: iri-reference
                      '@type':
                        type: string
                      hydra:first:
                        type: string
                        format: iri-reference
                      hydra:last:
                        type: string
                        format: iri-reference
                      hydra:previous:
                        type: string
                        format: iri-reference
                      hydra:next:
                        type: string
                        format: iri-reference
                  hydra:search:
                    type: object
                    properties:
                      '@type':
                        type: string
                      hydra:template:
                        type: string
                      hydra:variableRepresentation:
                        type: string
                      hydra:mapping:
                        type: array
                        items:
                          type: object
                          properties:
                            '@type':
                              type: string
                            variable:
                              type: string
                            property:
                              type:
                              - string
                              - 'null'
                            required:
                              type: boolean
                required:
                - hydra:member
            application/vnd.api+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyContact-read'
      deprecated: false
  /company_contacts/{id}:
    get:
      tags:
      - CompanyContact
      summary: Retrieves a CompanyContact resource
      description: Retrieves a CompanyContact resource.
      operationId: api_company_contacts_id_get
      parameters:
      - name: id
        in: path
        description: CompanyContact identifier
        required: true
        deprecated: false
        style: simple
        explode: false
        allowReserved: false
        schema:
          type: string
      responses:
        '200':
          description: CompanyContact resource
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/CompanyContact.jsonld-read'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CompanyContact-read'
        '404':
          description: Resource not found
      deprecated: false
