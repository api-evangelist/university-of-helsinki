      description: Retrieves the collection of CompanyContact resources.
      operationId: api_company_contacts_get_collection
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        style: form
        explode: false
        allowReserved: false
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        allowEmptyValue: true
        style: form
        explode: false
        allowReserved: false
        schema:
          type: integer
          default: 20
          maximum: 50
          minimum: 0
      - name: sort
        in: query
        description: 'Sort results by given field (id, firstnames, lastname, fullname). Default sort: ASC. Example for DESC: "firstnames,desc".'
