  /api/person/{username}/{class}/{type}:
    get:
      tags:
      - Person
      summary: Public groups of a person
      operationId: byPerson
      parameters:
      - name: username
        in: path
        description: Groups by person username
        required: true
        schema:
          type: string
      - name: class
        in: path
        description: Group collection class
        required: true
        schema:
          type: string
          enum:
          - degreeProgrammes
      - name: type
        in: path
        description: Group collection type
        required: true
        schema:
          type: string
          enum:
          - steeringGroups
      responses:
        '200':
          description: Output type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
