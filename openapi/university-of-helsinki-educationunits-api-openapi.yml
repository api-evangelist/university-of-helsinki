openapi: 3.2.0
info:
  title: Organisation Registry Public Education Units API
  description: Organisation Registry Public API
  version: 1.0.0
servers:
- url: https://gw.api.helsinki.fi/organisation/info
security:
- apiKey: []
tags:
- name: EducationUnits
paths:
  /v1/educationUnits:
    get:
      summary: GET v1/educationUnits
      operationId: getEducationUnits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EducationUnit'
              examples:
                Human Resources Example:
                  $ref: '#/components/examples/EducationUnitsExample'
      tags:
      - EducationUnits
  /v2/educationUnits:
    get:
      summary: GET v2/educationUnits
      operationId: getEducationUnitsV2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EducationUnitV2'
              examples:
                Human Resources Example:
                  $ref: '#/components/examples/EducationUnitsExampleV2'
      tags:
      - EducationUnits
components:
  examples:
