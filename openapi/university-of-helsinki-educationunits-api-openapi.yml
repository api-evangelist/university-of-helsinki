      - uniqueId: '87654321'
        code: '01'
        abbreviation: null
        type: kansio
        nameFi: Helsingin yliopisto
        nameEn: University of Helsinki
        nameSv: Helsingfors universitet
        educationQualifier: null
        parent: null
    EducationUnitsExample:
      value:
