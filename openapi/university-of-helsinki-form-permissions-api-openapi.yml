components:
  schemas:
    FormPermissionPersonDto:
      type: object
      properties:
        admins:
          type: array
          items:
            type: string
        editors:
          type: array
          items:
            type: string
        permissionRequests:
          type: array
          items:
            type: string
      required:
      - admins
      - editors
      - permissionRequests
    FormPermissionDto:
      type: object
      properties:
        restrictAccess:
          enum:
          - MHL.restrictAccessStrict
          - MHL.restrictAccessLoose
          type: string
        admins:
          type: array
          items:
            type: string
        editors:
          type: array
          items:
            type: string
        permissionRequests:
          type: array
          items:
            type: string
        collectionID:
          type: string
        hasAdmins:
          type: boolean
      required:
      - admins
      - editors
      - permissionRequests
      - collectionID
  securitySchemes:
    Access_token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Access token
    Lang:
      type: apiKey
      in: header
      name: Accept-Language
      description: Sets the 'Accept-Language' header. One of 'fi', 'sv,' 'en'. Defaults to 'en'.
    Person_token:
      type: apiKey
      in: header
      name: Person-Token
