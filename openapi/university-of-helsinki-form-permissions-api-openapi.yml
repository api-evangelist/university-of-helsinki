  /form-permissions/{collectionID}/{personID}:
    put:
      operationId: FormPermissionsController_acceptAccess
      parameters:
      - name: collectionID
        required: true
        in: path
        schema:
          type: string
      - name: personID
        required: true
        in: path
        schema:
          type: string
      - name: type
        required: false
        in: query
        description: Access type
        schema:
          default: editor
          type: string
          enum:
          - admin
          - editor
      - name: Person-Token
        required: false
        description: Person's authentication token who is authorizing the acception
        in: header
        schema:
          type: string
      responses:
