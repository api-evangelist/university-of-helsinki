components:
  schemas:
    store-iucnRedListTaxonGroup:
      type: object
      properties:
        '@context':
          type: string
          title: Context for the IUCN Red List Evaluation Informal Taxon Group
        id:
          type: string
          title: Id for the IUCN Red List Evaluation Informal Taxon Group
        '@type':
          type: string
          title: Type for the IUCN Red List Evaluation Informal Taxon Group
        hasIucnSubGroup:
          type: array
          uniqueItems: false
          items:
            type: string
          minItems: 0
          title: Has sub group
        includesInformalTaxonGroup:
          type: array
          uniqueItems: false
          items:
            type: string
          minItems: 0
          title: Includes informal taxon group
        includesTaxon:
          type: array
          uniqueItems: false
          items:
            type: string
          minItems: 0
          title: Includes taxon
        name:
          type: string
      required: []
      additionalProperties: false
    IucnRedListTaxonGroupExpanded:
      type: object
      properties:
        '@context':
          type: string
          title: Context for the IUCN Red List Evaluation Informal Taxon Group
        id:
          type: string
          title: Id for the IUCN Red List Evaluation Informal Taxon Group
        '@type':
          type: string
          title: Type for the IUCN Red List Evaluation Informal Taxon Group
        hasIucnSubGroup:
          $ref: '#/components/schemas/IucnRedListTaxonGroupExpanded'
        includesInformalTaxonGroup:
          type: array
          uniqueItems: false
          items:
            type: string
          minItems: 0
          title: Includes informal taxon group
        includesTaxon:
          type: array
          uniqueItems: false
          items:
            type: string
          minItems: 0
          title: Includes taxon
        name:
          type: string
      required:
      - name
      - id
      additionalProperties: false
  securitySchemes:
    Access_token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Access token
    Lang:
      type: apiKey
      in: header
      name: Accept-Language
      description: Sets the 'Accept-Language' header. One of 'fi', 'sv,' 'en'. Defaults to 'en'.
    Person_token:
      type: apiKey
      in: header
      name: Person-Token
