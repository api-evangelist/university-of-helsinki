---
aid: university-of-helsinki
name: University of Helsinki
description: >-
  The University of Helsinki is Finland's oldest and largest multidisciplinary
  research university, founded in 1640, and is ranked #68 in the QS World
  University Rankings 2025. Its public developer and API footprint centers on
  open scholarly infrastructure: Helda, the university's institutional
  repository, runs on DSpace 7 and exposes both a public REST API and an
  OAI-PMH metadata-harvesting interface. The university also maintains official
  GitHub organizations for its IT, computer science, student services, and
  language technology groups. Student-facing academic data flows through the
  Funidata Sisu student information system (Kori GraphQL/REST APIs), which is
  used institutionally but is not publicly documented or self-service.
