- aid: university-of-helsinki:research-portal
  name: University of Helsinki Research Portal — Elsevier Pure tenant
  description: >-
    TENANT RELATIONSHIP. researchportal.helsinki.fi is an Elsevier Pure deployment (the page markup identifies
    Pure and Elsevier directly). It is the University's research information system and its content is
    the University's, but the contract is Elsevier's and shipping it under this slug is precisely the
    misattribution this pipeline exists to prevent. Pure's ws/api web service is not publicly exposed
    on this host (404), and /en/persons/ returns 403 to unauthenticated crawlers.
  humanURL: https://researchportal.helsinki.fi/
