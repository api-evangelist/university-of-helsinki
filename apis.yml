  pipeline: pipeline-university
  run: '2026-08-30'
  prior_run: '2026-06-03'
  operator_axis_settled: true
  institution_surfaces: 22
  tenant_surfaces: 3
  vendor_surfaces_rejected: 3
  contracts_saved: 13
  note: 'Re-profiled under the university pipeline. The 2026-06-03 profile recorded three surfaces and
    missed the University''s entire first-party API gateway. No vendor contract was saved: Pure, Primo
    and Sisu are recorded as tenancy with x-operator: tenant and no specification. The three gateway
    APIs whose upstream is vendor software (Dependency Track, Flamma/Liferay, the internal guide CMS)
    are listed as institution-operated endpoints because the University runs and publishes them, but
    no contract is stored for any of them because none publishes one.'
