- aid: university-of-helsinki:sisu-kori
  name: Sisu (Kori) Student Information System — University of Helsinki tenant
  description: >-
    TENANT RELATIONSHIP, NOT A UNIVERSITY CONTRACT. The University runs its own instance of Sisu, the
    student information system built by Funidata Oy and shared across Finnish universities, at sisu.helsinki.fi.
    Its Kori curriculum component answers read requests anonymously on that host — GET /kori/api/module-search
    returns 400 with {"message":"AT_LEAST_ONE_SEARCH_PARAM_REQUIRED"} and no credential — and the error
    envelope names fi.helsinki.otm.common.model.OtmId, the Funidata OTM learner data model. The data is
    the University's; the contract is Funidata's and is identical at every Sisu customer, so no specification
    for it is stored under this institution. Recorded because the tenancy is a real institutional fact.
    The base /kori/api returns 500 with a JSON body; the resource paths beneath it answer with 400 validation
    errors, which is what proves the surface is live and unauthenticated.
  humanURL: https://sisu.helsinki.fi/student/
  baseURL: https://sisu.helsinki.fi/kori/api
  x-operator: tenant
  x-vendor: Funidata Oy (Sisu)
