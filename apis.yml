x-coverage:
  state: covered
  reason: covered
  detail: 'The University of Helsinki operates a genuine first-party API program and this profile now
    reflects it. Thirteen institution-operated OpenAPI documents were harvested and saved — twelve from
    the University''s own Gravitee portal at api.helsinki.fi and one from api.laji.fi (FinBIF, run by
    Luomus, a University institute) — totalling 267 paths and 316 component schemas, plus three live
    OAI-PMH endpoints, two DSpace REST APIs, and a Shibboleth/OIDC identity provider with sixteen entities
    in the Haka federation. Nothing was fabricated and nothing was derived from a link: every specification
    was fetched from a 200 response and stored pristine in openapi/_original/. The limit on this coverage
    is access, not discovery — the gateway has keyless plans DISABLED and portal self-registration OFF,
    so no gateway endpoint can be exercised anonymously and every example for those APIs is structural
    rather than probed. Three surfaces are recorded as tenancy rather than as the University''s work:
    Sisu/Kori (Funidata), the research portal (Elsevier Pure) and Helka (Ex Libris Primo). The previous
    profile, written 2026-06-03, saw only Helda and missed the entire gateway.'
  evidence:
  - url: https://api.helsinki.fi/portal/environments/DEFAULT/apis?size=200
    status: 200
    note: 15 public APIs, all running.
  - url: https://api.helsinki.fi/portal/environments/DEFAULT/configuration
    status: 200
    note: keyless and sharedApiKey disabled; X-Api-Key header.
  - url: https://api.helsinki.fi/portal/environments/DEFAULT/apis/1c4778a8-7883-4248-8778-a87883a248d0/pages
    types: SWAGGER
    status: 200
    note: Per-API Swagger pages readable anonymously; 12 of 15 have one.
  - url: https://api.laji.fi/openapi
    status: 200
    note: FinBIF Swagger UI; spec extracted from swagger-ui-init.js, 177 paths.
  - url: https://helda.helsinki.fi/server/api
    status: 200
    note: DSpace 7.6.2 HAL root.
  - url: https://datakatalogi.helsinki.fi/server/api
    status: 200
    note: DSpace 9.0 HAL root, HyDatacatalogue — not previously catalogued.
  - url: https://helda.helsinki.fi/server/oai/request?verb=Identify
    status: 200
    note: OAI-PMH 2.0, 14 metadata formats.
  - url: https://datakatalogi.helsinki.fi/server/oai/request?verb=Identify
    status: 200
    note: OAI-PMH 2.0.
  - url: https://journals.helsinki.fi/index/oai?verb=Identify
    status: 200
    note: OAI-PMH 2.0, Editori.
  - url: https://login.helsinki.fi/.well-known/openid-configuration
    status: 200
    note: OIDC discovery with eduPerson/SCHAC claims.
  - url: https://login.helsinki.fi/idp/shibboleth
    status: 200
    note: Shibboleth IdP SAML metadata, scope helsinki.fi.
  - url: https://haka.funet.fi/metadata/haka-metadata.xml
    status: 200
    note: 16 helsinki.fi entityIDs in the Haka federation aggregate.
  - url: https://moodle.helsinki.fi/mod/lti/certs.php
    status: 200
    note: LTI 1.3 platform JWKS.
  - url: https://sisu.helsinki.fi/kori/api/module-search?limit=1
    status: 400
    note: Tenant surface; answers anonymously with the Funidata OTM error envelope.
  - url: https://researchportal.helsinki.fi/
    status: 200
    note: Elsevier Pure; ws/api not exposed (404).
  - url: https://helka.helsinki.fi/
    status: 200
    note: Ex Libris Primo, view 358UOH_INST:VU1.
  - url: https://gw.api.helsinki.fi/scim/v2/ServiceProviderConfig
    status: 404
    note: No SCIM.
  - url: https://www.helsinki.fi/llms.txt
    status: 403
    note: No llms.txt; CDN blocks the path.
  - url: https://wiki.helsinki.fi/X/me05mC
    status: 401
    note: The fuller developer wiki the portal links is auth-gated; not emitted as a pointer.
  - url: https://version.helsinki.fi/
    status: 200
    note: Institution-operated GitLab, behind a bot challenge on anonymous access; API not publicly
      readable.
  - url: https://gw.api.helsinki.fi/organisation
    status: 401
    note: 'Representative of all 15 gateway contexts: 401 without a key. This is the proof that keyless
      is disabled, not a dead pointer.'
