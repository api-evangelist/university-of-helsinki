aid: university-of-helsinki
name: University of Helsinki
description: 'The University of Helsinki is Finland''s oldest and largest multidisciplinary research
  university, founded in 1640, and it is one of the very few institutions in this cohort that operates
  a real, first-party API program rather than only renting vendor platforms. It runs its own Gravitee
  API gateway at gw.api.helsinki.fi behind a public developer portal at api.helsinki.fi, listing fifteen
  public APIs — organisations, buildings and spaces, employee and group directories, service management,
  the application-portfolio register, network registry, and the CMS behind helsinki.fi and the course
  pages — twelve of which publish a readable OpenAPI. Alongside that sit genuinely institution-operated
  scholarly and identity infrastructure: Helda (DSpace 7.6.2) and the newer HY Data Catalogue (DSpace
  9.0), three live OAI-PMH endpoints, the Editori open-publishing service, the Shibboleth/OIDC identity
  provider at login.helsinki.fi with sixteen entities registered in the Haka federation, and the Finnish
  Biodiversity Information Facility (api.laji.fi, 177 paths), which is run by Luomus, a University institute.
  What the University does NOT author is equally important and is recorded here as tenancy rather than
  as its own work: Sisu/Kori is Funidata''s, the research portal is Elsevier Pure, and Helka is Ex Libris
  Primo. The gateway is affiliation-gated — keyless access is disabled and portal self-registration
  is off — so the catalogue and every specification are readable by anyone, while a credential requires
  a university or Haka identity.'
