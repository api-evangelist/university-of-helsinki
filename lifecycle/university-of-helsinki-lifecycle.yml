versioning:
  scheme: none-in-uri
  detail: >-
    Not one of the fifteen gateway APIs carries a version segment in its path. Every entrypoint is
    a bare context path on a single host — https://gw.api.helsinki.fi/{context} — so
    `info.version` in the OpenAPI is the only version signal, and there is no way for a caller to
    pin one. Declared versions range from 0.1 (PersonGroup) to 2.0.0 (EmployeeInformationAPI,
    Contact Search). One spec declares `"version": "Versioning not supported"` as a literal
    string, which is at least honest.
  api_versions:
    Course pages CMS: Versioning not supported
    HY Building API: 1.0.0
    General Efecte API: null
    Helsinki.fi content: 1.2.0
    PersonGroup: 1.0.0
    Dawa Sync API: 1.0.0
    Network registry API: '1.0'
    EmployeeInformationAPI: 2.0.0
    HY Organisation API: 1.0.0
    Sovellussalkku API: '0.3'
    ServiceAPI: 1.0.0
    Contact Search API: 2.0.0
    FinBIF Laji API: null
  note: >-
    Two mismatches worth recording. The portal card for EmployeeInformationAPI advertises 1.4.0
    while the spec it serves declares info.version 2.0.0; the portal card for Contact Search
    advertises 1.0.0 while the spec declares 2.0.0. The catalogue and the contract disagree about
    the version of the same API.
