authorization_model:
  kind: plan-subscription
  described_by: Gravitee API Management
  detail: >-
    Authorization at the University of Helsinki gateway is not expressed as OAuth scopes. It is
    expressed as a SUBSCRIPTION: an application is registered in the portal, subscribed to one
    named API, and granted one named plan on that API. The plan is the grant. Two APIs make this
    visible in their own specs — Helsinki.fi content declares two separate `X-Api-Key` schemes,
    `NewsApiKey` and `StudySearchApiKey`, described as "issued by the news plan" and "issued by
    the study search plan", which is plan-as-scope stated in the provider's own words.
  plan_security_enabled:
